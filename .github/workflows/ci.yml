name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # 文档同步检查:把 lawlietfeng/faui 拉到 ../faui,跑 sync-docs --check。
  # 当前 T8 还没逐组件 review 完,期间允许失败(continue-on-error),只用作可见性。
  # T8 收尾后把 continue-on-error 去掉,让它真正阻塞 PR。
  docs-sync:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: faui-landing-page
      - uses: actions/checkout@v4
        with:
          repository: lawlietfeng/faui
          path: faui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run sync-docs --check
        working-directory: faui-landing-page
        run: node scripts/sync-docs.mjs --check

